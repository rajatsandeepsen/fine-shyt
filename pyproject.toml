[project]
name = "model"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.13.0",
    "unsloth>=2026.3.11",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.poe.tasks]
gpu = "uv run ./src/gpu.py"
start = "uv run --with jupyter jupyter lab"

[tool.ruff.lint]
ignore = ["E731"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "poethepoet>=0.48.0",
    "ty>=0.0.70",
]
