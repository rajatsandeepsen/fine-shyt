[project]
name = "model"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.3.0",
    "fastapi[standard]>=0.141.1",
    "torch>=2.13.0",
    "unsloth>=2026.3.11",
]

[tool.poe]
executor = "uv"
env = { PYTHONPATH = "." }

# uv run poe <task_name>

[tool.poe.tasks]
gpu = "uv run ./src/gpu.py"
lab = "uv run --with jupyter jupyter lab"
fine-tune = "uv run ./src/fine_tune/model.py"
fine-infer = "uv run ./src/fine_tune/inference.py"
test-template = "uv run ./src/fine_tune/test.py"

[tool.poe.tasks.dev]
help   = "Run an inference server with model"
cmd = "uv run fastapi dev --reload-dir ./app --port ${port}"
args = [{ name = "port", options = ["--port"], default = "3000" }]

[tool.poe.tasks.prod]
help   = "Run a production inference server with model"
cmd = "uv run fastapi run --port ${port}"
args = [{ name = "port", options = ["--port"], default = "3000" }]

[tool.fastapi]
entrypoint = "app.main:api"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff.lint]
ignore = ["E731"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "poethepoet>=0.48.0",
    "ty>=0.0.70",
]
